[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mast"
version = "1.0.0"
description = "Python code reviewer, bug hunter and enterprise standards for Claude Code — zero dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zascia Hugo" }]
keywords = [
  "claude",
  "claude-code",
  "code-review",
  "static-analysis",
  "bug-detection",
  "python",
  "coding-standards",
  "ast",
  "linter",
  "developer-tools",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/zugobite/mast"
Documentation = "https://github.com/zugobite/mast/tree/main/docs"
Issues = "https://github.com/zugobite/mast/issues"

[project.scripts]
mast = "mast.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.mast.analysis]
requireDocstrings = false
maxFunctionLines = 70
maxComplexity = 14

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "SIM108", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
